name: k8s-tile-test
label: "test tile"
icon_image: $( icon )
metadata_version: "3.2.0"
minimum_version_for_upgrade: 0.0.0
product_version: $( version )
rank: 1
serial: false
property_blueprints:
- $( property "database_name" )
- $( property "admin_password" )
form_types:
- $( form "db_props" )
variables:
- name: sample-tile-ca
  type: certificate
  options:
    common_name: Sample Tile CA
    is_ca: true
    duration: 730
package_installs:
- $( package "test-install" )
compatible_kubernetes_distributions:
- name: k0s
  version: '>0.0.0'
supports_parallel_deploys: true
requires_product_versions:
- name: some-other-product
  version: '>=1.0.0'
  optional: true
